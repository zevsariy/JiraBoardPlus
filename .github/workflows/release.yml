name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/test.yml
  release:
    needs: checks
    permissions:
      contents: write
    uses: ./.github/workflows/release-publish.yml
    with:
      checks_result: ${{ needs.checks.result }}
      dry_run: false
