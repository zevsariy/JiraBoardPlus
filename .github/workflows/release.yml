name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag and version
        run: node -e "if ('v'+require('./manifest.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm test
      - run: python scripts/package.py
      - name: Extract release notes
        run: |
          python - <<'PY'
          import json, pathlib
          version = json.loads(pathlib.Path('manifest.json').read_text())['version']
          text = pathlib.Path('CHANGELOG.md').read_text()
          notes = text.split('## ' + version, 1)[1].split('\n## ', 1)[0]
          pathlib.Path('dist/release-notes.md').write_text('## ' + version + notes)
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "Jira Board Plus $GITHUB_REF_NAME" --notes-file dist/release-notes.md
