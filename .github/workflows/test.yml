name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-ui-theme.cjs
      - run: git diff --exit-code -- src/ui-theme.js
  browser:
    name: Full browser suite (30 scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JBP_TEST_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run every browser scenario
        shell: bash
        run: |
          mkdir -p test-output
          npm run test:browser 2>&1 | tee test-output/browser-suite.log
      - name: Upload browser logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/
          if-no-files-found: warn
          retention-days: 14
